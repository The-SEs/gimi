server {
    listen 80;

    # Serve the React frontend for all standard routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This try_files is crucial for React Router to work!
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ requests to the Django backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /admin/ requests to Django admin (optional but helpful)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /media/ files so uploaded images load correctly
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
