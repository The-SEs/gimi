version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gimi_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gimi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: gimi_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: gimi_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: gimi_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/media:/app/media

  celery:
    build: ./backend
    container_name: gimi_celery
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A core worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_API_URL=${VITE_API_URL}
    container_name: gimi_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
